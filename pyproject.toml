[project]
name = "vn-mcp-blender"
version = "0.1.0"
description = "MCP server dung mo hinh nha 3D trong Blender tu du lieu kien truc Viet Nam"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Ck15" }]
keywords = ["mcp", "blender", "architecture", "bim", "xay-dung"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
    "mcp>=1.8.0,<2",
    "ezdxf>=1.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
vn-mcp-blender = "vn_mcp_blender.cli:main"

[project.urls]
Homepage = "https://github.com/andyluu98/vn-mcp-blender"
Issues = "https://github.com/andyluu98/vn-mcp-blender/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vn_mcp_blender"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
